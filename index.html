<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Practice Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFF6E5;
    --bg2: #FFEFD1;
    --panel: #FFFFFF;
    --ink: #2D2A4A;
    --ink-soft: #6B6690;
    --coral: #FF6F59;
    --coral-bright: #FF8A75;
    --teal: #2EC4B6;
    --teal-dark: #1FA79A;
    --sun: #FFC93C;
    --lav: #C9B6E4;
    --line: rgba(45,42,74,0.12);
    --cat-fur: #F4A259;
    --cat-fur-dark: #E08434;
    --cat-muzzle: #FFF3E0;
    --cat-ear-inner: #FFB6A3;
    --cat-nose: #FF6F59;
    --cat-eye: #2D2A4A;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(circle at 15% 0%, #FFEFD1 0%, transparent 45%),
      radial-gradient(circle at 100% 15%, #E9F9F7 0%, transparent 40%),
      var(--bg);
    color: var(--ink);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3, .display{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
  }
  button{ font-family: inherit; cursor: pointer; }
  input, select, textarea{ font-family: inherit; }

  .app{ max-width: 760px; margin: 0 auto; padding: 24px 18px 80px; }

  /* ---------- Header ---------- */
  .app-header{
    display:flex; align-items:center; justify-content: space-between;
    padding-bottom: 16px; margin-bottom: 20px;
    flex-wrap: wrap; gap: 12px;
  }
  .app-title-row{ display:flex; align-items:center; gap: 10px; }
  .app-title{ font-size: 24px; margin:0; color: var(--coral); }
  .app-title span{ color: var(--ink); }
  .who{ text-align:right; font-size: 13px; color: var(--ink-soft); }
  .who b{ color: var(--ink); font-weight:800; }
  .switch-link{
    background:none; border:none; color: var(--ink-soft); font-size: 12px;
    text-decoration: underline; padding: 0; margin-top: 4px;
  }
  .streak-pill{
    display:inline-flex; align-items:center; gap:4px; background: var(--coral);
    color:#fff; font-weight: 800; font-size: 12px; padding: 4px 10px 4px 8px;
    border-radius: 20px; margin-left: 8px;
  }

  /* ---------- Gate (choose who you are) ---------- */
  .gate{ padding-top: 4vh; text-align:center; }
  .gate-mascot{ width: 140px; margin: 0 auto 6px; }
  .mascot-trio{ display:flex; gap:10px; justify-content:center; margin-bottom:6px; }
  .mascot-trio .mini{ width:58px; }
  .mascot-pick{ display:flex; gap:8px; margin:8px 0 16px; }
  .mascot-pick label{
    flex:1; text-align:center; border:2px solid var(--line); border-radius:14px;
    padding:8px 4px 6px; cursor:pointer; font-size:11px; font-weight:800; color:var(--ink-soft);
  }
  .mascot-pick label.selected{ border-color: var(--coral); color:var(--ink); background:#FFF1EC; }
  .mascot-pick svg{ width:48px; display:block; margin:0 auto 4px; }
  .speech-bubble{
    display:inline-block; background:#fff; border-radius: 18px; padding: 10px 18px;
    font-weight: 700; font-size: 15px; margin-bottom: 24px; position: relative;
    box-shadow: 0 3px 0 var(--line);
  }
  .gate h1{ font-size: 34px; margin: 6px 0 6px; color: var(--coral); }
  .gate p.sub{ color: var(--ink-soft); margin: 0 0 34px; font-size: 15px; font-weight:600; }
  .gate-options{ display:flex; gap: 16px; justify-content:center; flex-wrap: wrap; }
  .gate-card{
    background: var(--panel); color: var(--ink); border-radius: 20px;
    width: 280px; padding: 24px 22px; text-align:left;
    box-shadow: 0 4px 0 var(--line);
  }
  .gate-card.teal{ box-shadow: 0 4px 0 rgba(46,196,182,0.35); }
  .gate-card h3{ margin: 0 0 4px; font-size: 20px; }
  .gate-card p{ margin: 0 0 16px; font-size: 13px; color: var(--ink-soft); line-height:1.5; font-weight:600;}
  .gate-card input, .gate-card select{
    width:100%; padding: 10px 12px; border: 2px solid var(--line);
    background: #fff; border-radius: 12px; font-size: 14px; margin-bottom: 10px; font-weight:700;
  }
  .btn{
    display:inline-block; background: var(--coral); color: #fff;
    border: none; padding: 11px 18px; border-radius: 14px; font-size: 14px;
    font-weight: 800; box-shadow: 0 3px 0 rgba(0,0,0,0.15); transition: transform 0.08s;
  }
  .btn:active{ transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }
  .btn:hover{ background: var(--coral-bright); }
  .btn-teal{ background: var(--teal); }
  .btn-teal:hover{ background: var(--teal-dark); }
  .btn-ghost{
    background: #fff; border: 2px solid var(--line); color: var(--ink); box-shadow:none;
  }
  .btn-block{ width:100%; text-align:center; }
  .btn:disabled{ opacity: 0.4; cursor: default; box-shadow:none; }

  /* ---------- Tabs ---------- */
  .tabs{ display:flex; gap: 6px; margin-bottom: 20px; flex-wrap:wrap; }
  .tab{
    background: var(--panel); border:none; color: var(--ink-soft); padding: 9px 16px;
    font-size: 14px; font-weight: 800; border-radius: 12px;
  }
  .tab.active{ color: #fff; background: var(--coral); }

  .panel{ display:none; }
  .panel.active{ display:block; }

  .card{
    background: var(--panel); color: var(--ink); border-radius: 20px;
    padding: 22px; margin-bottom: 16px; box-shadow: 0 3px 0 var(--line);
  }
  .card h2{ font-size: 19px; margin: 0 0 4px; }
  .card .hint{ color: var(--ink-soft); font-size: 13px; margin: 0 0 18px; font-weight:600; }

  /* ---------- Streak card ---------- */
  .streak-card{ display:flex; align-items:center; gap: 18px; flex-wrap: wrap; }
  .streak-mascot{ width: 84px; flex-shrink:0; }
  .streak-info{ flex:1; min-width:200px; }
  .streak-num{ font-size: 34px; color: var(--coral); line-height:1; }
  .streak-sub{ font-size: 12.5px; color: var(--ink-soft); font-weight:700; margin-bottom:10px; }
  .week-strip{ display:flex; gap: 6px; }
  .week-dot{
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size: 10px; font-weight:800;
    color: var(--ink-soft);
  }
  .week-dot.done{ background: var(--teal); border-color: var(--teal); color:#fff; }
  .week-dot.today{ border-color: var(--coral); }

  /* ---------- Metronome ---------- */
  .metro-wrap{ display:flex; gap: 24px; align-items:center; flex-wrap: wrap; }
  .pendulum-box{
    width: 120px; height: 150px; position: relative; flex-shrink:0;
    border-bottom: 4px solid var(--ink); border-radius: 2px;
  }
  .pendulum-arm{
    position: absolute; bottom: 0; left: 50%; width: 4px; height: 130px;
    background: var(--ink); transform-origin: bottom center; transform: rotate(-18deg); border-radius: 3px;
  }
  .pendulum-bob{
    position:absolute; top: -9px; left: -8px; width: 20px; height: 20px;
    border-radius: 50%; background: var(--coral);
  }
  .metro-controls{ flex: 1; min-width: 220px; }
  .bpm-row{ display:flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .bpm-num{ font-size: 50px; line-height: 1; color: var(--ink); }
  .bpm-label{ color: var(--ink-soft); font-size: 13px; font-weight:700; }
  input[type=range]{ width: 100%; accent-color: var(--coral); margin-bottom: 14px; }
  .bpm-btnrow{ display:flex; gap:8px; margin-bottom: 14px; flex-wrap: wrap; }
  .bpm-btnrow button{
    background: var(--bg2); border: none; color: var(--ink);
    padding: 7px 13px; border-radius: 10px; font-size: 13px; font-weight:800;
  }
  .meter-select{ display:flex; gap: 6px; margin-bottom: 16px; }
  .meter-select button{
    background: var(--bg2); border: none; color: var(--ink);
    padding: 7px 12px; border-radius: 10px; font-size: 13px; font-weight:800;
  }
  .meter-select button.active{ background: var(--ink); color: #fff; }
  .beat-dots{ display:flex; gap: 8px; margin-bottom: 16px; height: 16px; }
  .beat-dot{ width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--coral); }
  .beat-dot.on{ background: var(--coral); }
  .beat-dot.accent{ border-color: var(--sun); }
  .beat-dot.accent.on{ background: var(--sun); }
  .play-btn{ font-size: 15px; padding: 12px 28px; }

  /* ---------- Tuner ---------- */
  .tuner-body{ text-align:center; }
  .tuner-note{ font-size: 68px; color: var(--ink); line-height:1; margin: 6px 0 2px; }
  .tuner-freq{ color: var(--ink-soft); font-size: 13px; margin-bottom: 20px; font-weight:700;}
  .tuner-meter{
    position: relative; height: 50px; margin: 0 auto 20px; max-width: 420px;
    background: var(--bg2); border-radius: 25px;
  }
  .tuner-center-line{
    position:absolute; left: 50%; top:6px; bottom:6px; width: 2px; background: var(--ink-soft);
  }
  .tuner-needle{
    position: absolute; top: 4px; width: 6px; height: 42px; background: var(--coral);
    left: 50%; transform: translateX(-50%); border-radius: 3px; transition: left 0.08s linear, background 0.15s;
  }
  .tuner-needle.in-tune{ background: var(--teal); }
  .tuner-status{ font-size: 13px; color: var(--ink-soft); min-height: 18px; margin-bottom: 18px; font-weight:700;}
  .mic-note{ font-size: 12px; color: var(--ink-soft); margin-top: 14px; font-weight:600;}

  /* ---------- Practice log ---------- */
  .timer-row{ display:flex; align-items:center; gap: 18px; margin-bottom: 18px; flex-wrap: wrap; }
  .timer-display{ font-size: 38px; color: var(--ink); min-width: 120px; }
  .field-row{ display:flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .field-row textarea, .field-row input{
    flex: 1; min-width: 180px; padding: 10px 12px; border: 2px solid var(--line);
    border-radius: 12px; font-size: 14px; background:#fff; color: var(--ink); font-weight:600;
  }
  .manual-add{ display:flex; gap:10px; margin-top: 6px; flex-wrap: wrap; align-items:center;}
  .manual-add input[type=number]{ width: 90px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; }
  .log-entry{
    display:flex; justify-content:space-between; gap: 14px; padding: 12px 0;
    border-top: 2px dashed var(--line);
  }
  .log-entry .meta{ font-size: 12px; color: var(--ink-soft); font-weight:600;}
  .log-entry .mins{ font-weight:800; color: var(--coral); white-space:nowrap; }
  .log-empty{ color: var(--ink-soft); font-size: 13px; padding: 14px 0; font-weight:600;}
  .week-total{
    display:inline-block; background: var(--sun); color: var(--ink);
    padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 4px; font-weight:800;
  }
  .student-picker{ margin-bottom: 16px; }
  .student-picker select{
    padding: 9px 12px; border-radius: 12px; border: 2px solid var(--line); font-size: 14px; font-weight:700;
  }
  table.roster{ width:100%; border-collapse: collapse; font-size: 13px; }
  table.roster th{ text-align:left; color: var(--ink-soft); font-weight:800; padding: 6px 4px; border-bottom: 2px solid var(--line); }
  table.roster td{ padding: 9px 4px; border-bottom: 2px dashed var(--line); font-weight:600; }

  /* ---------- Assignments ---------- */
  .assign-item{
    display:flex; align-items:flex-start; gap: 10px; padding: 12px 0;
    border-top: 2px dashed var(--line);
  }
  .assign-item input[type=checkbox]{ margin-top: 3px; accent-color: var(--teal); width:18px; height:18px;}
  .assign-text{ flex:1; font-size: 14px; font-weight:700; }
  .assign-text.done{ text-decoration: line-through; color: var(--ink-soft); }
  .assign-meta{ font-size: 11px; color: var(--ink-soft); font-weight:700; }
  .assign-del{ background:none; border:none; color: var(--ink-soft); font-size: 12px; text-decoration: underline; }
  .assign-form{ display:flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .assign-form select{ padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; }

  .loading{ color: var(--ink-soft); font-size: 13px; padding: 40px 0; text-align:center; font-weight:700;}
  .footnote{ color: var(--ink-soft); font-size: 11.5px; text-align:center; margin-top: 30px; line-height:1.6; font-weight:600;}

  /* ---------- Scales ---------- */
  .instrument-picker select{
    width:100%; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line);
    font-size: 15px; font-weight:700; margin-bottom: 18px; background:#fff;
  }
  .scale-card{
    border-top: 2px dashed var(--line); padding: 14px 0;
  }
  .scale-card:first-child{ border-top:none; padding-top:0; }
  .scale-card .concert-name{ font-weight:800; font-size: 14px; color: var(--ink-soft); }
  .scale-card .written-name{ font-family:'Baloo 2',sans-serif; font-size:20px; color: var(--coral); margin: 2px 0 6px; }
  .scale-notes{ display:flex; flex-wrap:wrap; gap:6px; }
  .scale-note{
    background: var(--bg2); color: var(--ink); font-weight:800; font-size: 13px;
    padding: 5px 11px; border-radius: 10px;
  }
  .scale-note.tonic{ background: var(--teal); color:#fff; }
  .scale-note.arpeggio{ background: var(--sun); color: var(--ink); }

  /* ---------- Ask & Share ---------- */
  .ask-type-row{ display:flex; gap:10px; margin-bottom:16px; }
  .ask-type-btn{
    flex:1; padding:14px 10px; border-radius:14px; border:2px solid var(--line);
    background:#fff; font-weight:800; font-size:14px; color:var(--ink-soft); text-align:center;
  }
  .ask-type-btn.selected.help{ background:var(--coral); border-color:var(--coral); color:#fff; }
  .ask-type-btn.selected.showoff{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .record-row{ display:flex; align-items:center; gap:12px; justify-content:center; margin:14px 0; flex-wrap:wrap; }
  .record-btn{
    display:flex; align-items:center; gap:8px; padding:11px 20px; border-radius:14px;
    border:none; font-weight:800; font-size:14px; background:var(--bg2); color:var(--ink);
  }
  .record-btn.recording{ background:var(--coral); color:#fff; }
  .record-dot{ width:10px; height:10px; border-radius:50%; background:currentColor; }
  .record-dot.pulse{ animation: recPulse 1s ease-in-out infinite; }
  @keyframes recPulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  .ask-msg-card{ border-top:2px dashed var(--line); padding:14px 0; }
  .ask-msg-card:first-child{ border-top:none; padding-top:0; }
  .ask-msg-head{ display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
  .ask-badge{ font-size:11px; font-weight:800; padding:3px 10px; border-radius:20px; color:#fff; }
  .ask-badge.help{ background:var(--coral); }
  .ask-badge.showoff{ background:var(--teal); }
  .ask-msg-meta{ font-size:11px; color:var(--ink-soft); font-weight:700; }
  .ask-msg-text{ font-size:14px; font-weight:600; margin:6px 0; line-height:1.5; }
  .ask-msg-card audio{ width:100%; margin-top:8px; }
  .ask-resolved-pill{ font-size:11px; font-weight:800; color:var(--teal); }

  /* ---------- Streak celebration ---------- */
  .streak-overlay{
    position:fixed; inset:0; background:rgba(45,42,74,0.55);
    display:flex; align-items:center; justify-content:center; z-index:9999;
    opacity:0; pointer-events:none; transition:opacity 0.25s ease;
  }
  .streak-overlay.show{ opacity:1; pointer-events:auto; }
  .streak-pop{
    position:relative; background: var(--panel); border-radius: 24px;
    padding: 34px 28px 26px; text-align:center; max-width: 270px;
    transform: scale(0.5); transition: transform 0.4s cubic-bezier(.34,1.56,.64,1);
    box-shadow: 0 10px 0 rgba(0,0,0,0.18);
  }
  .streak-overlay.show .streak-pop{ transform: scale(1); }
  .streak-pop .flame{
    font-size: 48px; display:block; margin-bottom: 2px;
    animation: flameFlicker 0.5s ease-in-out infinite alternate;
  }
  @keyframes flameFlicker{
    from{ transform: scale(1) rotate(-4deg); }
    to{ transform: scale(1.1) rotate(4deg); }
  }
  .streak-pop .mascot-mini{ width: 84px; margin: 2px auto 8px; }
  .streak-pop h3{ margin: 2px 0 4px; font-size: 22px; color: var(--coral); }
  .streak-pop p{ margin:0; font-size: 13px; color: var(--ink-soft); font-weight:700; }
  .confetti-dot{
    position:absolute; top:50%; left:50%; width:9px; height:9px; border-radius:50%;
    opacity:0; animation: confettiBurst 0.9s ease-out forwards;
  }
  @keyframes confettiBurst{
    0%{ transform: rotate(var(--angle)) translateY(0) scale(0.5); opacity:1; }
    100%{ transform: rotate(var(--angle)) translateY(-95px) scale(1); opacity:0; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading">Tuning up…</div>
</div>

<script>
(function(){

/* ================= Storage helpers =================
   Ported from the Claude-artifact version of this app, which used
   window.storage. That API only exists inside Claude — it's not a
   real browser API — so on Cloudflare Pages: personal (non-shared)
   data uses the browser's own localStorage (per-device, no server
   needed), and shared data (roster, classrooms, logs, assignments —
   the stuff every student/teacher needs to see) goes through the
   /api/storage Pages Function, backed by Cloudflare KV. */
async function sGet(key, shared){
  try{
    if(!shared){
      const raw = localStorage.getItem('pr:' + key);
      return raw ? JSON.parse(raw) : null;
    }
    const res = await fetch('/api/storage?key=' + encodeURIComponent(key), { cache: 'no-store' });
    if(!res.ok) return null;
    const data = await res.json();
    return (data && typeof data.value === 'string') ? JSON.parse(data.value) : null;
  } catch(e){ return null; }
}
async function sSet(key, value, shared){
  try{
    if(!shared){
      localStorage.setItem('pr:' + key, JSON.stringify(value));
      return;
    }
    await fetch('/api/storage', {
      method: 'POST',
      cache: 'no-store',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key, value: JSON.stringify(value) })
    });
  } catch(e){ console.error('storage set failed', e); }
}

/* ================= Mascots (pick a practice buddy) ================= */
const MASCOTS = {
  pug:     { name: 'Rocco',   label: 'Rocco the Pug' },
  otter:   { name: 'Maestro', label: 'Maestro the Otter' },
  bulldog: { name: 'Rocket',  label: 'Rocket the Bulldog' }
};
function animalPalette(kind){
  if(kind === 'otter') return { fur:'#A9754F', furDark:'#8C5E3C', muzzle:'#F5E6D3', nose:'#3A2A1E' };
  if(kind === 'bulldog') return { fur:'#D9A066', furDark:'#B97F45', muzzle:'#4A4038', nose:'#1F1B18' };
  return { fur:'#3A3532', furDark:'#252220', muzzle:'#4E4842', nose:'#141210' }; // pug
}
function mascotEars(kind, p){
  if(kind === 'otter'){
    return `<circle cx="52" cy="58" r="15" fill="${p.fur}"/><circle cx="148" cy="58" r="15" fill="${p.fur}"/>
            <circle cx="52" cy="58" r="7" fill="${p.furDark}" opacity="0.5"/><circle cx="148" cy="58" r="7" fill="${p.furDark}" opacity="0.5"/>`;
  }
  if(kind === 'bulldog'){
    return `<path d="M42 58 Q22 95 44 118 Q58 95 56 58 Z" fill="${p.fur}"/>
            <path d="M158 58 Q178 95 156 118 Q142 95 144 58 Z" fill="${p.fur}"/>`;
  }
  // pug: small rounded folded drop ears, close to the head
  return `<ellipse cx="40" cy="74" rx="15" ry="23" fill="${p.fur}" transform="rotate(-18 40 74)"/>
          <ellipse cx="160" cy="74" rx="15" ry="23" fill="${p.fur}" transform="rotate(18 160 74)"/>`;
}
function mascotFace(kind, p){
  if(kind === 'otter'){
    return `<ellipse cx="100" cy="130" rx="40" ry="26" fill="${p.muzzle}"/>
            <line x1="62" y1="128" x2="32" y2="122" stroke="${p.furDark}" stroke-width="3" stroke-linecap="round"/>
            <line x1="62" y1="136" x2="32" y2="140" stroke="${p.furDark}" stroke-width="3" stroke-linecap="round"/>
            <line x1="138" y1="128" x2="168" y2="122" stroke="${p.furDark}" stroke-width="3" stroke-linecap="round"/>
            <line x1="138" y1="136" x2="168" y2="140" stroke="${p.furDark}" stroke-width="3" stroke-linecap="round"/>`;
  }
  if(kind === 'bulldog'){
    return `<path d="M64 88 Q100 78 136 88" stroke="${p.furDark}" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6"/>
            <ellipse cx="100" cy="140" rx="46" ry="27" fill="${p.muzzle}"/>
            <ellipse cx="70" cy="142" rx="12" ry="16" fill="${p.muzzle}"/>
            <ellipse cx="130" cy="142" rx="12" ry="16" fill="${p.muzzle}"/>`;
  }
  // pug: flat wide wrinkly face, muzzle set high and close (short snout)
  return `<path d="M62 82 Q100 71 138 82" stroke="${p.furDark}" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
          <path d="M66 92 Q100 83 134 92" stroke="${p.furDark}" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.45"/>
          <line x1="100" y1="76" x2="100" y2="94" stroke="${p.furDark}" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
          <ellipse cx="100" cy="130" rx="46" ry="27" fill="${p.muzzle}"/>

/* ================= Major scale transposition engine =================
   Built algorithmically (not from memory of individual scales), so every
   scale is generated the same way real key signatures work: intervals in
   semitones, spelled using the next letter name each time. */
const LETTERS = ['C','D','E','F','G','A','B'];
const NATURAL_SEMITONES = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
const MAJOR_INTERVALS = [0,2,4,5,7,9,11];

function parseTonic(t){
  const letter = t[0];
  let semitone = NATURAL_SEMITONES[letter];
  for(const c of t.slice(1)){ if(c==='#') semitone++; if(c==='b') semitone--; }
  semitone = ((semitone % 12) + 12) % 12;
  return { letterIdx: LETTERS.indexOf(letter), semitone };
}
function spellNote(letterIdx, targetSemitone){
  const letter = LETTERS[((letterIdx % 7) + 7) % 7];
  const natural = NATURAL_SEMITONES[letter];
  let diff = ((targetSemitone - natural) % 12 + 12) % 12;
  if(diff > 6) diff -= 12;
  let acc = '';
  if(diff === 1) acc = '#'; else if(diff === 2) acc = '##';
  else if(diff === -1) acc = 'b'; else if(diff === -2) acc = 'bb';
  return letter + acc;
}
function buildMajorScale(tonicStr){
  const { letterIdx, semitone } = parseTonic(tonicStr);
  const notes = MAJOR_INTERVALS.map((iv,i)=> spellNote(letterIdx+i, (semitone+iv)%12));
  notes.push(notes[0]);
  return notes;
}
function transposeTonic(tonicStr, semitoneShift, letterShift){
  const { letterIdx, semitone } = parseTonic(tonicStr);
  return spellNote(letterIdx + letterShift, ((semitone + semitoneShift) % 12 + 12) % 12);
}
function prettyAcc(note){ return note.replace(/#/g,'♯').replace(/b/g,'♭'); }
// Preferred single-accidental spelling for each pitch class, used as a fallback
// when a transposed tonic would otherwise force a double sharp/flat (like F##) —
// real key signatures cap out at 7 accidentals, and no band chart writes doubles.
const PREFERRED_SPELLING = ['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
function buildMajorScaleSafe(tonicStr){
  let notes = buildMajorScale(tonicStr);
  let tonic = tonicStr;
  if(notes.some(n => n.length >= 3)){ // a "##" or "bb" shows up as a 3+ char note
    const { semitone } = parseTonic(tonicStr);
    tonic = PREFERRED_SPELLING[semitone];
    notes = buildMajorScale(tonic);
  }
  return { notes, tonic };
}

/* ================= Streak logic ================= */
function toDateStr(d){ return d.toISOString().slice(0,10); }


function computeStreak(entries){
  const dates = new Set(entries.map(e=>e.date));
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = toDateStr(today);
  const practicedToday = dates.has(todayStr);

  let cursor = new Date(today);
  if(!practicedToday) cursor.setDate(cursor.getDate()-1);
  let current = 0;
  while(dates.has(toDateStr(cursor))){
    current++;
    cursor.setDate(cursor.getDate()-1);
  }

  const sorted = Array.from(dates).sort();
  let best = 0, run = 0, prev = null;
  for(const ds of sorted){
    if(prev){
      const prevDate = new Date(prev); prevDate.setDate(prevDate.getDate()+1);
      if(toDateStr(prevDate) === ds) run++; else run = 1;
    } else run = 1;
    best = Math.max(best, run);
    prev = ds;
  }
  return { current, best, practicedToday, dates };
}

function weekStrip(dates){
  const today = new Date(); today.setHours(0,0,0,0);
  const labels = ['S','M','T','W','T','F','S'];
  let html = '';
  for(let i=6;i>=0;i--){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const ds = toDateStr(d);
    const done = dates.has(ds);
    const isToday = i===0;
    html += `<div class="week-dot ${done?'done':''} ${isToday?'today':''}">${done ? '✓' : labels[d.getDay()]}</div>`;
  }
  return html;
}

let metro = {
  playing: false, bpm: 100, beatsPerMeasure: 4, subdivision: 1, subBeatCounter: 0,
  audioCtx: null, nextNoteTime: 0, timerId: null, tapTimes: []
};
const lookahead = 25.0, scheduleAheadTime = 0.1;
const SUBDIVISIONS = [ {n:1, label:'None'}, {n:2, label:'8ths'}, {n:3, label:'Triplets'}, {n:4, label:'16ths'} ];

function renderMetronome(container){
  container.innerHTML = `

          </div>
          <button class="btn play-btn" id="metroToggle">${metro.playing? 'Stop' : 'Start'}</button>

function startMetronome(){
  if(!metro.audioCtx) metro.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(metro.audioCtx.state === 'suspended') metro.audioCtx.resume();
  metro.playing = true;
  metro.subBeatCounter = 0;
  metro.nextNoteTime = metro.audioCtx.currentTime + 0.05;
  scheduler();
}
function stopMetronome(){
  metro.playing = false;
  if(metro.timerId) clearTimeout(metro.timerId);
}
function scheduler(){
  if(!metro.playing) return;
  while(metro.nextNoteTime < metro.audioCtx.currentTime + scheduleAheadTime){
    const beatNumber = Math.floor(metro.subBeatCounter / metro.subdivision) % metro.beatsPerMeasure;
    const subIndex = metro.subBeatCounter % metro.subdivision;
    scheduleClick(beatNumber, subIndex, metro.nextNoteTime);
    const secondsPerBeat = 60.0 / metro.bpm;
    metro.nextNoteTime += secondsPerBeat / metro.subdivision;
    metro.subBeatCounter = (metro.subBeatCounter + 1) % (metro.beatsPerMeasure * metro.subdivision);
  }
  metro.timerId = setTimeout(scheduler, lookahead);
}
function scheduleClick(beatNumber, subIndex, time){
  const osc = metro.audioCtx.createOscillator();
  const gain = metro.audioCtx.createGain();
  osc.connect(gain); gain.connect(metro.audioCtx.destination);
  const isMainBeat = subIndex === 0;
  const accent = beatNumber === 0 && isMainBeat;
  osc.frequency.value = accent ? 1500 : (isMainBeat ? 1000 : 700);
  const peak = accent ? 0.5 : (isMainBeat ? 0.3 : 0.14);
  gain.gain.setValueAtTime(peak, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
  osc.start(time); osc.stop(time + 0.05);
  if(isMainBeat){
    const delayMs = (time - metro.audioCtx.currentTime) * 1000;
    setTimeout(()=> flashBeat(beatNumber), Math.max(0, delayMs));
  }
}
function flashBeat(beatNumber){
  const dots = document.querySelectorAll('#beatDots .beat-dot');
  dots.forEach(d=>d.classList.remove('on'));
  if(dots[beatNumber]) dots[beatNumber].classList.add('on');
  setTimeout(()=>{ if(dots[beatNumber]) dots[beatNumber].classList.remove('on'); }, 120);
}
function animatePendulum(){
  const arm = document.getElementById('pendArm');
  if(!arm) return;
  let dir = 1;
  function step(){
    if(!document.getElementById('pendArm')) return;
    const arm2 = document.getElementById('pendArm');
    if(metro.playing){
      const secondsPerBeat = 60.0/metro.bpm;
      arm2.style.transition = `transform ${secondsPerBeat}s linear`;
      dir *= -1;
      arm2.style.transform = `rotate(${dir*18}deg)`;
      setTimeout(step, secondsPerBeat*1000);
    } else {
      arm2.style.transition = `transform 0.4s ease`;
      arm2.style.transform = `rotate(-18deg)`;
    }
  }
  step();
}

let tuner = { active: false, audioCtx: null, analyser: null, stream: null, raf: null };
const noteStrings = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
let drone = { active: false, audioCtx: null, osc: null, gain: null, note: 'Bb', octave: 4 };
function droneFrequency(noteStr, octave){
  const { semitone } = parseTonic(noteStr);
  const midi = (octave + 1) * 12 + semitone;
  return 440 * Math.pow(2, (midi - 69) / 12);
}
function startDrone(){
  if(!drone.audioCtx) drone.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(drone.audioCtx.state === 'suspended') drone.audioCtx.resume();
  const freq = droneFrequency(drone.note, drone.octave);
  drone.osc = drone.audioCtx.createOscillator();
  drone.osc.type = 'sine';
  drone.osc.frequency.value = freq;
  drone.gain = drone.audioCtx.createGain();
  drone.gain.gain.setValueAtTime(0, drone.audioCtx.currentTime);
  drone.gain.gain.linearRampToValueAtTime(0.22, drone.audioCtx.currentTime + 0.15);
  drone.osc.connect(drone.gain);
  drone.gain.connect(drone.audioCtx.destination);
  drone.osc.start();
  drone.active = true;
}
function stopDrone(){
  if(drone.active && drone.osc && drone.gain && drone.audioCtx){
    const now = drone.audioCtx.currentTime;
    drone.gain.gain.cancelScheduledValues(now);
    drone.gain.gain.setValueAtTime(drone.gain.gain.value, now);
    drone.gain.gain.linearRampToValueAtTime(0, now + 0.12);
    drone.osc.stop(now + 0.15);
  }
  drone.active = false;
  drone.osc = null; drone.gain = null;
}
function updateDronePitchLive(){
  if(drone.active && drone.osc){ drone.osc.frequency.setValueAtTime(droneFrequency(drone.note, drone.octave), drone.audioCtx.currentTime); }
}

async function startTuner(){
  if(!window.isSecureContext){ return 'insecure'; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ return 'unsupported'; }
  try{
    tuner.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }catch(e){
    return (e && e.name === 'NotAllowedError') ? 'denied' : 'error';
  }
  tuner.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = tuner.audioCtx.createMediaStreamSource(tuner.stream);
  tuner.analyser = tuner.audioCtx.createAnalyser();
  tuner.analyser.fftSize = 2048;
  source.connect(tuner.analyser);
  tuner.active = true;
  tunerLoop();
  return 'ok';
}
function stopTuner(){
  tuner.active = false;
  if(tuner.raf) cancelAnimationFrame(tuner.raf);
  if(tuner.stream) tuner.stream.getTracks().forEach(t=>t.stop());
  if(tuner.audioCtx) tuner.audioCtx.close();
  tuner.audioCtx = null; tuner.stream = null; tuner.analyser = null;
}

/* ================================================================
   ASK & SHARE — students send a note and/or a short voice recording
   to their teacher; teacher sees an inbox scoped to the classroom.
   ================================================================ */
let recorder = { active:false, mediaRecorder:null, chunks:[], stream:null, audioDataUrl:null, startedAt:null, tickId:null };
const MAX_RECORD_SECONDS = 60;

async function startRecording(onTick){
  if(!window.isSecureContext) return 'insecure';
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') return 'unsupported';
  try{
    recorder.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }catch(e){
    return (e && e.name === 'NotAllowedError') ? 'denied' : 'error';
  }
  const preferred = ['audio/webm', 'audio/mp4', 'audio/ogg'];
  const mimeType = preferred.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
  recorder.mediaRecorder = mimeType ? new MediaRecorder(recorder.stream, { mimeType }) : new MediaRecorder(recorder.stream);
  recorder.chunks = [];
  recorder.audioDataUrl = null;
  recorder.mediaRecorder.ondataavailable = (e)=>{ if(e.data && e.data.size > 0) recorder.chunks.push(e.data); };
  recorder.mediaRecorder.start();
  recorder.active = true;
  recorder.startedAt = Date.now();
  recorder.tickId = setInterval(()=>{
    const sec = Math.floor((Date.now() - recorder.startedAt)/1000);
    if(onTick) onTick(sec);
    if(sec >= MAX_RECORD_SECONDS) stopRecording();
  }, 250);
  return 'ok';
}
function stopRecording(){
  return new Promise((resolve)=>{
    if(!recorder.active || !recorder.mediaRecorder){ resolve(null); return; }
    clearInterval(recorder.tickId);
    recorder.mediaRecorder.onstop = async ()=>{
      const blob = new Blob(recorder.chunks, { type: recorder.mediaRecorder.mimeType || 'audio/webm' });
      recorder.audioDataUrl = await blobToDataURL(blob);
      if(recorder.stream) recorder.stream.getTracks().forEach(t=>t.stop());
      recorder.active = false;
      resolve(recorder.audioDataUrl);
    };
    recorder.mediaRecorder.stop();
  });
}
function blobToDataURL(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onloadend = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
function discardRecording(){
  recorder.audioDataUrl = null;
  recorder.chunks = [];
}

  loadMySubmissions();

function tunerLoop(){
  if(!tuner.active || !tuner.analyser) return;
  const buf = new Float32Array(tuner.analyser.fftSize);
  tuner.analyser.getFloatTimeDomainData(buf);
  const freq = autoCorrelate(buf, tuner.audioCtx.sampleRate);
  const noteEl = document.getElementById('tunerNote');
  const freqEl = document.getElementById('tunerFreq');
  const needle = document.getElementById('tunerNeedle');
  const status = document.getElementById('tunerStatus');
  if(freq !== -1 && noteEl){
    const noteNum = 12 * (Math.log(freq/440)/Math.log(2)) + 69;
    const rounded = Math.round(noteNum);
    const name = noteStrings[(rounded+120)%12];
    const octave = Math.floor(rounded/12) - 1;
    const refFreq = 440 * Math.pow(2, (rounded-69)/12);
    const cents = Math.floor(1200 * Math.log(freq/refFreq)/Math.log(2));
    noteEl.textContent = name + octave;
    freqEl.textContent = freq.toFixed(1) + ' Hz';
    const clamped = Math.max(-50, Math.min(50, cents));
    needle.style.left = (50 + clamped) + '%';
    const inTune = Math.abs(cents) <= 5;
    needle.classList.toggle('in-tune', inTune);
    status.textContent = inTune ? 'In tune' : (cents > 0 ? 'Sharp — tune down a touch' : 'Flat — tune up a touch');
  } else if(noteEl){
    freqEl.textContent = 'Listening…';
    status.textContent = '';
  }
  tuner.raf = requestAnimationFrame(tunerLoop);
}
// Standard autocorrelation pitch detector (ACF2+).
function autoCorrelate(buffer, sampleRate){
  const SIZE = buffer.length;
  let rms = 0;
  for(let i=0;i<SIZE;i++) rms += buffer[i]*buffer[i];
  rms = Math.sqrt(rms/SIZE);
  if(rms < 0.01) return -1;

  let r1=0, r2=SIZE-1;
  const thres = 0.2;
  for(let i=0;i<SIZE/2;i++){ if(Math.abs(buffer[i])<thres){ r1=i; break; } }
  for(let i=1;i<SIZE/2;i++){ if(Math.abs(buffer[SIZE-i])<thres){ r2=SIZE-i; break; } }
  const trimmed = buffer.slice(r1, r2);
  const n = trimmed.length;
  if(n < 2) return -1;

  const c = new Array(n).fill(0);
  for(let i=0;i<n;i++){
    for(let j=0;j<n-i;j++){
      c[i] += trimmed[j]*trimmed[j+i];
    }
  }
  let d=0; while(d < n-1 && c[d] > c[d+1]) d++;
  let maxval=-1, maxpos=-1;
  for(let i=d;i<n;i++){ if(c[i]>maxval){ maxval=c[i]; maxpos=i; } }
  if(maxpos <= 0) return -1;
  let T0 = maxpos;
  const x1 = c[T0-1] || 0, x2 = c[T0] || 0, x3 = c[T0+1] || 0;
  const a = (x1 + x3 - 2*x2)/2;
  const b = (x3 - x1)/2;
  if(a) T0 = T0 - b/(2*a);
  if(T0 <= 0) return -1;
  return sampleRate / T0;
}

/* ================================================================
   PRACTICE LOG
   ================================================================ */
let logTimer = { running: false, startedAt: null, elapsedMs: 0, tickId: null };

function startSessionTimer(){
  if(logTimer.running) return;
  logTimer.startedAt = Date.now();
  logTimer.running = true;
  logTimer.tickId = setInterval(()=>{
    const d = document.getElementById('timerDisplay');
    if(d) d.textContent = formatMs(logTimer.elapsedMs + (Date.now()-logTimer.startedAt));
  }, 500);
}
function stopSessionTimerAccumulate(){
  if(!logTimer.running) return;
  clearInterval(logTimer.tickId);
  logTimer.elapsedMs += Date.now() - logTimer.startedAt;
  logTimer.running = false;
}
async function autoSaveAndResetTimer(){
  if(!(state.me && state.me.role === 'student')) return;
  if(!logTimer.running) return;
  stopSessionTimerAccumulate();
  const mins = Math.round(logTimer.elapsedMs/60000);
  if(mins >= 1){
    await addLogEntry(state.me.id, mins, '(auto-saved when the app closed)');
  }
  logTimer = { running:false, startedAt:null, elapsedMs:0, tickId:null };
}
// Best-effort autosave when the tab is closed, backgrounded, or navigated away from.
document.addEventListener('pagehide', ()=>{ autoSaveAndResetTimer(); });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) autoSaveAndResetTimer(); });

function currentLogStudentId(){
  if(state.me.role === 'student') return state.me.id;
  return state.viewingStudentId;
}

async function renderLog(container){
  const isTeacher = state.me.role === 'teacher';
  const studentId = currentLogStudentId();

  let pickerHtml = '';
  if(isTeacher){
    pickerHtml = `
      <div class="student-picker">
        <select id="studentPick">
          ${state.roster.map(s=>`<option value="${s.id}" ${s.id===studentId?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}
        </select>

  }

  container.innerHTML = `
    <div class="card streak-card" id="streakCard">Loading streak…</div>
    <div class="card">

      <p class="hint">${isTeacher ? "Track and review each student's practice time." : "Log your practice sessions here."}</p>
      ${pickerHtml}

    </div>
    ${isTeacher ? `<div class="card" id="rosterOverviewCard"><h2>This week, at a glance</h2><div id="rosterOverview">Loading…</div></div>` : ''}
  `;

    document.getElementById('logBody').innerHTML = `<p class="log-empty">No students on the roster yet.</p>`;
    return;
  }

  const entries = (await sGet('practice:' + studentId, true)) || [];
  const st = computeStreak(entries);
  const streakEl = document.getElementById('streakCard');
  if(streakEl){
    streakEl.innerHTML = `
      <div class="streak-mascot">${mascotSvg((state.roster.find(s=>s.id===studentId)||{}).mascot || defaultMascot(), streakMood(st.current))}</div>
      <div class="streak-info">
        <div class="streak-num display">${st.current} day${st.current===1?'':'s'}</div>
        <div class="streak-sub">${st.current>0 ? `Keep it going! Best streak: ${st.best} days` : "No streak yet — practice today to start one!"}</div>
        <div class="week-strip">${weekStrip(st.dates)}</div>
      </div>
    `;
  }

  const bodyEl = document.getElementById('logBody');
  const weekTotal = sumThisWeek(entries);

  bodyEl.innerHTML = `
    <div class="week-total">${weekTotal} min this week</div>
    ${!isTeacher ? `
    <div class="timer-row">
      <div class="timer-display display" id="timerDisplay">${formatMs(logTimer.running ? logTimer.elapsedMs + (Date.now()-logTimer.startedAt) : logTimer.elapsedMs)}</div>
      <button class="btn" id="timerToggle">${logTimer.running ? 'Stop session' : 'Start session'}</button>
    </div>
    <div class="field-row" id="sessionNoteRow" style="${logTimer.running || logTimer.elapsedMs>0 ? '' : 'display:none'}">
      <textarea id="sessionNotes" rows="2" placeholder="What did you work on?"></textarea>
    </div>
    <div class="field-row" id="saveRow" style="${(!logTimer.running && logTimer.elapsedMs>0) ? '' : 'display:none'}">
      <button class="btn" id="saveSession">Save this session</button>
      <button class="btn btn-ghost" id="discardSession">Discard</button>
    </div>
    <div class="manual-add">
      <span style="font-size:13px;color:var(--ink-soft);font-weight:700;">Or add a past session:</span>
      <input type="number" id="manualMins" placeholder="minutes" min="1">
      <input type="text" id="manualNotes" placeholder="notes (optional)">
      <button class="btn btn-ghost" id="manualAdd">Add</button>
    </div>
    ` : ''}
    <div id="entryList"></div>
  `;

  const listEl = document.getElementById('entryList');
  if(entries.length === 0){
    listEl.innerHTML = `<p class="log-empty">No sessions logged yet.</p>`;
  } else {
    listEl.innerHTML = entries.slice().reverse().map(en => `
      <div class="log-entry">
        <div>
          <div>${escapeHtml(en.notes || '(no notes)')}</div>
          <div class="meta">${en.date}</div>
        </div>
        <div class="mins">${en.minutes} min</div>
      </div>
    `).join('');
  }

  if(!isTeacher){
    document.getElementById('timerToggle').onclick = ()=>{
      if(logTimer.running){
        stopSessionTimerAccumulate();
      } else {
        startSessionTimer();
      }
      renderLog(container);
    };
    const saveBtn = document.getElementById('saveSession');
    if(saveBtn) saveBtn.onclick = async ()=>{
      const mins = Math.max(1, Math.round(logTimer.elapsedMs/60000));
      const notes = document.getElementById('sessionNotes').value.trim();

      logTimer = { running:false, startedAt:null, elapsedMs:0, tickId:null };
      renderLog(container);
      renderMain();

    };
    const discardBtn = document.getElementById('discardSession');
    if(discardBtn) discardBtn.onclick = ()=>{
      logTimer = { running:false, startedAt:null, elapsedMs:0, tickId:null };
      renderLog(container);
    };

      const mins = parseInt(document.getElementById('manualMins').value, 10);
      if(!mins || mins <= 0) return;
      const notes = document.getElementById('manualNotes').value.trim();
      const result = await addLogEntry(studentId, mins, notes);
      renderLog(container);
      renderMain();
      if(result.newlyQualifies) showStreakCelebration(studentId, result.streak);
    };
  }
}

async function addLogEntry(studentId, minutes, notes){
  const entries = (await sGet('practice:' + studentId, true)) || [];
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = toDateStr(today);
  const alreadyQualifiedToday = entries.some(e => e.date === todayStr && e.minutes >= 5);
  entries.push({ date: todayStr, minutes, notes });
  await sSet('practice:' + studentId, entries, true);
  const newlyQualifies = minutes >= 5 && !alreadyQualifiedToday;
  const streak = computeStreak(entries).current;
  return { newlyQualifies, streak };
}

function showStreakCelebration(studentId, streakCount){
  const mascotKind = (state.roster.find(s=>s.id===studentId)||{}).mascot || defaultMascot();
  const colors = ['var(--coral)','var(--teal)','var(--sun)','var(--lav)'];
  const dots = Array.from({length:8}).map((_,i)=>
    `<span class="confetti-dot" style="--angle:${i*45}deg; background:${colors[i%4]}"></span>`
  ).join('');
  const overlay = document.createElement('div');
  overlay.className = 'streak-overlay';
  overlay.innerHTML = `
    <div class="streak-pop">
      ${dots}
      <span class="flame">🔥</span>
      <div class="mascot-mini">${mascotSvg(mascotKind, 'excited')}</div>
      <h3>${streakCount} day streak!</h3>
      <p>Great practicing today — keep it going!</p>
    </div>
  `;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=> overlay.classList.add('show'));
  const dismiss = ()=>{
    overlay.classList.remove('show');
    setTimeout(()=> overlay.remove(), 300);
  };
  overlay.onclick = dismiss;
  setTimeout(dismiss, 2600);
}

function formatMs(ms){
  const totalSec = Math.floor(ms/1000);
  const m = Math.floor(totalSec/60);
  const s = totalSec % 60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}
function sumThisWeek(entries){
  const now = new Date();
  const day = (now.getDay()+6)%7;
  const monday = new Date(now); monday.setDate(now.getDate()-day); monday.setHours(0,0,0,0);
  return entries.filter(e => new Date(e.date) >= monday).reduce((a,e)=>a+e.minutes,0);
}

}

      await sSet('assignments:' + studentId, l, true);
      renderAssignList(studentId, isTeacher);
    };
  });
}
